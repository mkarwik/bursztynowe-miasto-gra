<style>
/* Układ: jedna kolumna na telefon, górny pasek ze skarbcem, dolny pasek zakładek. Jasne tło, bo gra toczy się na dworze. */
:root{
  --ink:#16262d; --sea:#1d4f5a; --sea2:#2d6b78; --mute:#5c6b70; --line:#cfd8d9; --tint:#eef3f3; --paper:#f7f9f9; --card:#ffffff;
  --amber:#b4730c; --amber2:#e9a23b; --amber-tint:#fbf3e2; --ok:#1f7a4a; --ok-tint:#e5f4ec; --bad:#b3382c; --bad-tint:#fbe9e7;
  --display:"Alegreya",Georgia,serif; --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.35; -webkit-text-size-adjust:100% }

.wrap{ max-width:720px; margin:0 auto; padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px }

.tabs .in{ max-width:720px; margin:0 auto; display:flex; overflow-x:auto; scrollbar-width:none } .tabs .in::-webkit-scrollbar{ display:none }
.tabs button{ flex:1; border:0; background:none; padding:12px 2px 10px; font-size:.82rem; font-weight:700; color:var(--mute); border-top:3px solid transparent; cursor:pointer; min-width:0; white-space:nowrap }

@media (max-width:420px){ .stats.five{ grid-template-columns:repeat(3,1fr) } }
.btn{ border:0; background:var(--sea); color:#fff; font-weight:700; padding:11px 16px; min-height:46px; cursor:pointer; border-radius:3px }
.btn.amber{ background:var(--amber) } .btn.ghost{ background:#fff; color:var(--sea); border:1.5px solid var(--sea) } .btn.bad{ background:var(--bad) }
.btn:disabled{ background:#c7d0d1; color:#6f7c80; cursor:not-allowed } .btn.ghost:disabled{ background:#fff; border-color:#c7d0d1 }
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:3px solid var(--amber2); outline-offset:2px }

.pill.ok{ background:var(--ok-tint); color:var(--ok) } .pill.bad{ background:var(--bad-tint); color:var(--bad) } .pill.amb{ background:var(--amber-tint); color:var(--amber) }
input[type=text],input[type=password],input[type=number],select,textarea{ border:1.5px solid var(--line); background:#fff; padding:10px 12px; min-height:46px; border-radius:3px; width:100% }
.field{ display:flex; gap:8px } .field input{ flex:1; min-width:0 }
table{ border-collapse:collapse; width:100%; font-size:.92rem }

td.n,th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
tr.me td{ background:var(--amber-tint); font-weight:700 } tr.done td{ color:var(--mute) } tr.cur td{ background:var(--tint); font-weight:700 }
.scroll{ overflow-x:auto }
label.btn{ display:inline-flex; align-items:center; justify-content:center } .btn.ico{ min-width:48px; padding:0 10px; font-size:1.2rem } .ile{ font-family:var(--body); font-size:.95rem; color:var(--mute); font-weight:500 } .lnk{ border:0; background:none; padding:2px 0; color:var(--sea); text-decoration:underline; font-size:.85rem; cursor:pointer } .lista .row{ padding:7px 0; border-bottom:1px solid var(--line); gap:10px; flex-wrap:nowrap } .lista .row > span:first-child{ flex:1; min-width:0 } .lista .row > .btn, .lista .row > .pill{ flex:none } .lista .row:last-child{ border-bottom:0 } .card.done{ opacity:.6 } .miniat{ display:flex; gap:10px; align-items:center; margin-top:8px } .miniat img{ height:64px; border:1px solid var(--line) } table.flota td{ vertical-align:middle } table.flota .btn.mini{ min-width:58px } .zdj img{ display:block; width:100%; max-height:420px; object-fit:contain; background:var(--tint); margin:8px 0 } .zdj .opis{ font-size:1.05rem; margin:6px 0 } .foto{ margin:8px 0; display:flex; flex-direction:column; gap:8px; align-items:flex-start } .foto img{ max-width:100%; max-height:260px; border:1px solid var(--line) } textarea{ width:100%; padding:10px; border:1px solid var(--line); background:#fff } .zgl{ margin-top:10px; border-top:1px solid var(--line); padding-top:6px } .zgl .row{ padding:5px 0; align-items:flex-start }
.zk{ display:flex; gap:4px; align-items:center; justify-content:center } .zk svg{ width:28px; height:28px } .zk.mini svg{ width:14px; height:14px } .zk.mini{ gap:2px; padding:5px 6px; background:#fff; border:1px solid var(--line); min-width:46px }
.zgra .box{ max-width:440px; gap:10px } .zczas{ font-family:var(--display); font-weight:800; font-size:1.4rem; color:var(--sea); font-variant-numeric:tabular-nums }
.zpasek{ height:6px; background:var(--tint) } .zpasek i{ display:block; height:100%; background:var(--amber); transition:width .2s linear }
.zplansza{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px } .zbtn{ background:#fff; border:2px solid var(--line); min-height:66px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:6px; border-radius:6px }
.zbtn.wyb{ border-color:var(--sea); background:var(--tint); box-shadow:0 0 0 2px var(--sea) inset } .zbtn.czeka{ border-color:var(--sea) } .zbtn.dobry{ border-color:var(--ok); background:var(--ok-tint); box-shadow:0 0 0 2px var(--ok) inset } .zbtn.nowa{ border-color:var(--amber, #c8860b) } @media (prefers-reduced-motion:no-preference){ .zbtn.nowa .zk{ animation:wejdz .35s ease-out } @keyframes wejdz{ from{ transform:scale(.6); opacity:0 } to{ transform:none; opacity:1 } } } .zbtn.zly{ border-color:var(--bad); background:var(--bad-tint) }
.zblok{ background:var(--bad-tint); color:var(--bad); font-weight:700; padding:8px; text-align:center } .zznal{ display:flex; flex-direction:column; gap:4px } .zprz{ display:flex; gap:6px; align-items:center }
.zinstr{ max-height:90vh; overflow:auto } .zprzyklad{ border-left:4px solid var(--ok); padding:6px 10px; background:var(--ok-tint); display:flex; flex-direction:column; gap:6px } .zprzyklad.zle{ border-left-color:var(--bad); background:var(--bad-tint) } .zprzyklad p{ font-size:.92rem }
.card.test{ border:2px dashed var(--sea); background:var(--tint) } .card.test .field{ margin-top:8px } .card.test select{ flex:1 }
.zpyt{ background:var(--amber-tint); border-left:4px solid var(--amber); padding:8px 10px; font-size:.95rem } .zlinia{ margin-top:6px }
.banner.ok{ background:var(--ok-tint); border-color:var(--ok) } .card.zest{ border-left:5px solid var(--amber) }
@media (prefers-reduced-motion:no-preference){ .zbtn.zly{ animation:trz .3s } @keyframes trz{ 25%{ transform:translateX(-4px) } 75%{ transform:translateX(4px) } } }
.alert{ border-left:5px solid var(--line) } .alert.zle{ border-left-color:var(--bad); background:var(--bad-tint) } .alert.uwaga{ border-left-color:var(--amber) } .alert p{ margin-top:4px; white-space:pre-line } .btn.mini{ min-height:32px; padding:4px 12px; font-size:.85rem } .ai{ white-space:pre-wrap; margin-top:6px; line-height:1.45 }
table.cmp{ margin-bottom:6px } table.atk td{ vertical-align:middle } .btns.col{ flex-direction:column; align-items:stretch } .zasady ul{ margin:8px 0 0 18px; padding:0 } .zasady li{ margin:4px 0; font-size:.92rem } .zasady summary{ cursor:pointer } table.cmp td:first-child{ white-space:nowrap } table.cmp th,table.cmp td{ padding:7px 5px } table.cmp .n{ text-align:right; width:52px; font-variant-numeric:tabular-nums }
table.porty th,table.porty td{ padding:7px 5px } table.porty td.n,table.porty th.n{ width:46px }
td.nw{ white-space:nowrap }
.log{ display:flex; flex-direction:column }
.log .e{ padding:8px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:54px 1fr; gap:8px }
.log .e .t{ color:var(--mute); font-variant-numeric:tabular-nums } .log .e.no .w{ color:var(--bad) }
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px }
.login .box{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px }
.login h1{ font-size:2.3rem; color:var(--ink) } .eyebrow{ font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:700 }
.modal{ position:fixed; inset:0; z-index:20; background:rgba(22,38,45,.55); display:flex; align-items:center; justify-content:center; padding:16px }
.modal .box{ background:#fff; width:100%; max-width:420px; padding:18px; display:flex; flex-direction:column; gap:14px; border-top:6px solid var(--amber) }
.ank .box{ max-height:calc(100vh - 32px); overflow-y:auto } .ankp{ border-top:1px solid var(--line); padding-top:10px } .ankp p{ font-weight:600; margin-bottom:6px } .ankoc{ display:flex; gap:6px; flex-wrap:wrap } .ankoc button{ min-width:44px; min-height:44px; border:1.5px solid var(--line); background:#fff; font-size:1rem; font-weight:700; color:var(--ink, #16262d); cursor:pointer } .ankoc button.on{ background:var(--amber); border-color:var(--amber); color:#fff } .ankoc button.nd{ min-width:auto; padding:0 10px; font-weight:500; font-size:.85rem } .ankskala{ display:flex; justify-content:space-between; font-size:.75rem; color:var(--mute); max-width:260px } .ankbar{ display:flex; gap:3px; align-items:flex-end; height:28px } .ankbar i{ display:block; width:14px; background:var(--amber) }
.modal .box.win{ border-top-color:var(--ok) } .modal .box.lose{ border-top-color:var(--bad) }
.dice{ display:flex; gap:10px; justify-content:center }
.die{ width:58px; height:58px; border:2.5px solid var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:2rem; background:#fff }
.die.drop{ opacity:.35; text-decoration:line-through }
.toast{ position:fixed; left:16px; right:16px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:15; max-width:688px; margin:0 auto; padding:12px 14px; background:var(--ok); color:#fff; font-weight:500; box-shadow:0 4px 14px rgba(0,0,0,.25) }
.toast.bad{ background:var(--bad) }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px } @media (max-width:520px){ .grid2{ grid-template-columns:1fr } }
details summary{ cursor:pointer; font-weight:700; color:var(--sea); padding:6px 0 }
.cfg table input{ min-height:38px; padding:6px 8px; min-width:70px } .cfg td{ padding:4px }
.small{ font-size:.88rem; color:var(--mute) }
.edg{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px } @media (max-width:480px){ .edg{ grid-template-columns:1fr } }
.edl{ display:flex; flex-direction:column; gap:3px; font-size:.9rem; color:var(--mute) } .edl input{ color:var(--ink) }
.edc{ display:flex; align-items:center; gap:10px; min-height:44px; font-weight:500 } .edc input{ width:22px; height:22px; flex:none }
@media (prefers-reduced-motion:no-preference){ .modal .box{ animation:pop .16s ease-out } @keyframes pop{ from{ transform:scale(.96); opacity:.6 } to{ transform:none; opacity:1 } } }
</style>

<body>
<div id="app"></div>
<div id="warstwa"></div>
<script>
'use strict';
var S = { haslo: '', w: null, tab: '', punkt: null, filtr: '', cfgEdycja: null, zajete: false, foty: {}, teksty: {} };
var $app = document.getElementById('app'), $war = document.getElementById('warstwa');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pam(k, v){ try{ if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }

function urzadzenie(){ var u = pam('bm_urz'); if (!u){ u = Math.random().toString(36).slice(2) + Date.now().toString(36); pam('bm_urz', u); } return u; }
function api(akcja){
  var nr = S.nrZap = (S.nrZap || 0) + 1;
  var punkt = S.w && S.w.rola === 'punktowy' ? S.punkt : null;
  return fetch('/api', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ haslo: S.haslo, akcja: akcja || null, urz: urzadzenie(), punkt: punkt }) })
    .then(function(r){ return r.json(); })
    .then(function(o){ o._nr = nr; return o; });
}
// Odpowiedzi mogą przyjść w innej kolejności niż zapytania: starszy widok nie nadpisuje nowszego.
function nowyWidok(o){ if (o._nr < (S.nrWid || 0)) return false; S.nrWid = o._nr; S.w = o.widok; return true; }
function odswiez(cicho){
  if (!S.haslo) return Promise.resolve();
  return api(null).then(function(o){
    if (o.blad){ if (o.zleHaslo) wyloguj(o.blad); else if (!cicho) toast(o.blad, true); return; }
    if (!nowyWidok(o)) return; if (!cicho || moznaPrzerysowac()) rysuj();
  }).catch(function(){ if (!cicho) toast('Brak połączenia z serwerem. Sprawdźcie internet.', true); });
}
function moznaPrzerysowac(){
  if ($war.innerHTML) return false;
  var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  var pola = $app.querySelectorAll('input[type=text],input[type=number],textarea');
  for (var i = 0; i < pola.length; i++) if (pola[i].value && !pola[i].hasAttribute('data-stale')) return false;
  if (S.w && S.w.rola === 'kadra' && (S.tab === 'cennik' || S.tab === 'korekta')) return false;
  return true;
}
function wykonaj(akcja){
  if (S.zajete) return; S.zajete = true; zamknij();
  api(akcja).then(function(o){
    S.zajete = false;
    if (o.blad){ if (o.zleHaslo) return wyloguj(o.blad); toast(o.blad, true); return; }
    nowyWidok(o); if (akcja && akcja.typ === 'zapisz_konfiguracje' && o.komunikat && o.komunikat.ok){ S.cfgEdycja = null; S.cfgOtwarte = null; }
    if (akcja && akcja.typ === 'zdjecie' && o.komunikat && o.komunikat.ok && S.wysylam){ delete S.foty[S.wysylam]; delete S.teksty[S.wysylam]; S.wysylam = null; }
    rysuj();
    var k = o.komunikat; if (!k) return;
    if (k.atak) wynikAtaku(k); else toast(k.tekst, !k.ok);
  }).catch(function(){ S.zajete = false; toast('Nie udało się wysłać. Sprawdźcie internet i spróbujcie jeszcze raz.', true); });
}
// Zmniejsza zdjęcie z telefonu do 1280 px i JPEG, żeby szybko poszło przez dane komórkowe.
function zmniejsz(plik, cb){
  var url = URL.createObjectURL(plik), img = new Image();
  img.onload = function(){
    var m = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, m / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    var d = c.toDataURL('image/jpeg', 0.72); if (d.length > 1800000) d = c.toDataURL('image/jpeg', 0.5);
    cb(d);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
var toastT = null;
function toast(tekst, zle){
  var d = document.getElementById('toast'); if (d) d.remove();
  d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (zle ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = tekst;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(function(){ d.remove(); }, zle ? 7000 : 4500);
  d.onclick = function(){ d.remove(); };
}
function zamknij(){ $war.innerHTML = ''; }
function potwierdz(tytul, opis, etykieta, akcja, klasa){
  $war.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box"><h2>' + esc(tytul) + '</h2>' + (opis ? '<p>' + opis + '</p>' : '') +
    '<div class="btns"><button class="btn ' + (klasa || 'amber') + '" id="mTak">' + esc(etykieta) + '</button><button class="btn ghost" id="mNie">Anuluj</button></div></div></div>';
  document.getElementById('mTak').onclick = function(){ wykonaj(akcja); };
  document.getElementById('mNie').onclick = zamknij;
  document.getElementById('mTak').focus();
}
function wynikAtaku(k){
  var kosci = k.kosci || [], min = kosci.length === 3 ? Math.min.apply(null, kosci) : null, odrzucona = false;
  var h = kosci.map(function(v){ var d = (min !== null && v === min && !odrzucona); if (d) odrzucona = true; return '<div class="die' + (d ? ' drop' : '') + '">' + v + '</div>'; }).join('');
  $war.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box ' + (k.wygrana ? 'win' : 'lose') + '"><h2>' + (k.wygrana ? 'Port zdobyty!' : 'Atak nieudany') + '</h2>' +
    '<div class="dice" aria-label="Wynik rzutu">' + h + '</div><p>' + esc(k.tekst) + '</p><div class="btns"><button class="btn" id="mOk">Dalej</button></div></div></div>';
  document.getElementById('mOk').onclick = zamknij; document.getElementById('mOk').focus();
}
// Ogłoszenie od kadry: raz na telefonie dla każdego nowego tekstu.
function pokazOgloszenie(w){
  var t = w.ogloszenie; if (!t || $war.innerHTML || S.oglWidziane === t || pam('bm_ogl') === t) return;
  $war.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box"><p class="eyebrow">Wiadomość od kadry</p><h2>Ważne!</h2><p>' + esc(t) + '</p><div class="btns"><button class="btn amber" id="mOgl">Rozumiemy</button></div></div></div>';
  document.getElementById('mOgl').onclick = function(){ S.oglWidziane = t; pam('bm_ogl', t); zamknij(); };
  document.getElementById('mOgl').focus();
}
// Ankieta po grze: każdy telefon wypełnia osobno.
function pokazAnkiete(w, sila){
  var b = document.getElementById('ankBtn'); if (b) b.onclick = function(){ pokazAnkiete(S.w, true); };
  var a = w.ankieta; if (!a || !a.otwarta || a.wypelniona) return;
  if (!sila && ($war.innerHTML || S.ankOdlozona)) return;
  S.ank = S.ank || { oceny: {}, najlepsze: '', poprawic: '' };
  var h = '<div class="modal ank" role="dialog" aria-modal="true"><div class="box"><p class="eyebrow">Ankieta</p><h2>Jak wam się grało?</h2><p class="sub">Oceny od 1 (słabo) do 5 (super). Każde pytanie można pominąć. Każdy wypełnia na swoim telefonie.</p>';
  a.pytania.forEach(function(q){
    var v = S.ank.oceny[q.id];

  w.ranking.forEach(function(r){

      '<p class="sub">Punkty żywe: ' + r.zywe + ' · martwe: ' + r.martwe + ' · znajdźki: ' + r.znajdzki + ' · nieudane ataki na następny port: ' + r.nieudane + '</p></div>';
  });
  return h;
}
function kDziennik(w){
  var h = '<h2>Dziennik</h2><select id="filtr" aria-label="Filtr gildii"><option value="">Wszystkie gildie</option>' + w.ranking.slice().sort(function(a, b){ return a.i - b.i; }).map(function(r){ return '<option value="' + r.i + '"' + (String(r.i) === S.filtr ? ' selected' : '') + '>' + esc(r.nazwa) + '</option>'; }).join('') + '</select>';
  var l = w.dziennik.filter(function(d){ return S.filtr === '' || String(d.g) === S.filtr; });
  if (!l.length) return h + '<p class="sub">Jeszcze nic się nie wydarzyło.</p>';
  h += '<div class="log">' + l.map(function(e){
    return '<div class="e' + (e.ok ? '' : ' no') + '"><span class="t">' + esc(e.czas.slice(0, 5)) + '</span><span><b>' + esc(e.gildia || 'Kadra') + '</b> · ' + esc(e.opis) + ' <span class="small">(' + esc(e.kto) + ')</span><br><span class="w">' + esc(e.wynik) + '</span>' +
      (e.b != null ? ' <span class="small">Skarbiec po: ' + e.b + '</span>' : '') + '</span></div>'; }).join('') + '</div><p class="small">Widać 300 ostatnich zdarzeń. Całość jest w eksporcie w zakładce Gra.</p>';
  return h;
}
function kKorekta(w){
  return '<h2>Korekta bursztynu</h2><p class="sub">Do naprawiania pomyłek. Liczba dodatnia dodaje bursztyn, ujemna odejmuje. Korekta zmienia też bursztyn zdobyty w całej grze i trafia do dziennika.</p>' +
    '<form class="card" id="fKor"><label for="korG">Gildia</label><select id="korG">' + w.ranking.slice().sort(function(a, b){ return a.i - b.i; }).map(function(r){ return '<option value="' + r.i + '">' + esc(r.nazwa) + ' (skarbiec ' + r.bursztyn + ')</option>'; }).join('') + '</select>' +
    '<label for="korIle">Ile bursztynu dodać lub odjąć</label><input id="korIle" type="number" step="1" inputmode="numeric" placeholder="np. 25 albo -25">' +
    '<label for="korPowod">Powód</label><input id="korPowod" type="text" maxlength="200" placeholder="np. punktowy zaliczył nie tę gildię"><button class="btn amber">Dalej</button></form>' + kEdycja(w);
}
function kEdycja(w){
  var c = w.konfiguracja, g = Math.min(S.edG || 0, w.stany.length - 1), st = w.stany[g];
  var num = function(attr, v, label, min){ return '<label class="edl"><span>' + esc(label) + '</span><input type="number" step="1"' + (min !== undefined ? ' min="' + min + '"' : '') + ' ' + attr + ' value="' + esc(v) + '" data-stale="1"></label>'; };
  var chk = function(attr, on, label){ return '<label class="edc"><input type="checkbox" ' + attr + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>'; };
  var h = '<h2>Edycja gildii</h2><p class="sub">Na wypadek awarii lub pomyłki: można dać albo zabrać statek, budowlę, port, punkt. Każda zmiana trafia do dziennika.</p>' +
    '<form class="card" id="fEd" novalidate><label for="edG">Gildia</label><select id="edG">' + c.gildie.map(function(x, i){ return '<option value="' + i + '"' + (i === g ? ' selected' : '') + '>' + esc(x.nazwa) + '</option>'; }).join('') + '</select>' +
    '<h3>Skarbiec i porty</h3><div class="edg">' + num('id="ed_b"', st.b, 'Bursztyn w skarbcu') + num('id="ed_z"', st.z, 'Zdobyty w całej grze', 0) + num('id="ed_p"', st.p, 'Zdobyte porty (0 do ' + c.porty.length + ')', 0) + num('id="ed_fail"', st.fail, 'Nieudane ataki na następny port', 0) + num('id="ed_premia"', st.premia || 0, 'Premia z Seta do ataku', 0) + '</div>' +
    '<h3>Statki</h3><div class="edg">' + c.statki.map(function(x){ return num('data-eds="' + esc(x.id) + '"', st.s[x.id] || 0, x.nazwa, 0); }).join('') + '</div>' +
    '<h3>Budowle</h3><div class="edg">' + c.budowle.map(function(x){ return chk('data-edb="' + esc(x.id) + '"', !!st.bud[x.id], x.nazwa); }).join('') + '</div>' +
    '<h3>Punkty żywe: liczba wizyt</h3><div class="edg">' + c.punkty_zywe.map(function(x, i){ return num('data-edzy="' + i + '"', st.zy[i] || 0, x.nazwa, 0); }).join('') + '</div>' +
    '<h3>Punkty martwe</h3><div class="edg">' + c.punkty_martwe.map(function(x, i){ return chk('data-edmd="' + i + '"', !!st.md[i], x.nazwa + ' zaliczony') + num('data-edmt="' + i + '"', st.mt[i] || 0, x.nazwa + ': zużyte próby', 0); }).join('') + '</div>' +
    '<h3>Znajdźki</h3><div class="edg">' + c.znajdzki.map(function(x, i){ return chk('data-edzn="' + i + '"', !!st.zn[i], x); }).join('') + '</div>' +
    '<button class="btn amber">Zapisz zmiany w gildii</button></form>';
  return h;
}
function zbierzEdycje(){
  var n = { s:{}, bud:{}, md:{}, mt:{}, zy:{}, zn:{} }, v = function(id){ return document.getElementById(id).value; }, i, p;
  n.b = v('ed_b'); n.z = v('ed_z'); n.p = v('ed_p'); n.fail = v('ed_fail'); n.premia = v('ed_premia');
  p = $app.querySelectorAll('[data-eds]'); for (i = 0; i < p.length; i++) n.s[p[i].dataset.eds] = p[i].value;
  p = $app.querySelectorAll('[data-edb]'); for (i = 0; i < p.length; i++) n.bud[p[i].dataset.edb] = p[i].checked;
  p = $app.querySelectorAll('[data-edzy]'); for (i = 0; i < p.length; i++) n.zy[p[i].dataset.edzy] = p[i].value;
  p = $app.querySelectorAll('[data-edmd]'); for (i = 0; i < p.length; i++) n.md[p[i].dataset.edmd] = p[i].checked;
  p = $app.querySelectorAll('[data-edmt]'); for (i = 0; i < p.length; i++) n.mt[p[i].dataset.edmt] = p[i].value;
  p = $app.querySelectorAll('[data-edzn]'); for (i = 0; i < p.length; i++) n.zn[p[i].dataset.edzn] = p[i].checked;
  return n;
}
var CFG_OPISY = { ustawienia:'Ustawienia', gildie:'Gildie i hasła', statki:'Statki', budowle:'Budowle', porty:'Porty (99 oznacza „nie da się”)', punkty_martwe:'Punkty martwe', punkty_zywe:'Punkty żywe', znajdzki:'Kody znajdziek (jeden w wierszu)' };
function kCennik(w){
  if (!S.cfgEdycja) S.cfgEdycja = JSON.parse(JSON.stringify(w.konfiguracja));
  var c = S.cfgEdycja, h = '<h2>Cennik i ustawienia</h2><div class="card"><p class="sub">Po nowej wersji aplikacji: wczytaj statki, budowle, porty i liczby z aplikacji. Gildie, hasła, punkty, kody i godziny zostają.</p><div class="btns"><button class="btn amber" id="domCfg">Przywróć domyślny cennik</button></div></div><p class="sub">Zmiany działają od razu po zapisaniu. W trakcie gry zmieniajcie tylko to, co konieczne.</p><div class="cfg">';
  Object.keys(CFG_OPISY).forEach(function(k){
    var v = c[k]; h += '<details' + (k === (S.cfgOtwarte || 'gildie') ? ' open' : '') + '><summary>' + esc(CFG_OPISY[k]) + '</summary>';
    if (k === 'znajdzki') h += '<textarea data-c="znajdzki" rows="10" aria-label="Kody znajdziek">' + esc(v.join('\n')) + '</textarea>';
    else if (Array.isArray(v)){
      var kol = Object.keys(v[0] || {});
      h += '<div class="scroll"><table><tr>' + kol.map(function(x){ return '<th>' + esc(x) + '</th>'; }).join('') + '</tr>' + v.map(function(w2, i){
        return '<tr>' + kol.map(function(x){ var num = typeof w2[x] === 'number'; return '<td><input ' + (num ? 'type="number" step="any"' : 'type="text"') + ' data-c="' + k + '" data-i="' + i + '" data-k="' + esc(x) + '" value="' + esc(w2[x]) + '" aria-label="' + esc(x) + '"' + (x === 'id' ? ' readonly' : '') + '></td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      if (CFG_NOWY[k]) h += '<div class="btns" style="margin:8px 0"><button class="btn ghost" data-dodaj="' + k + '">Dodaj wiersz</button><button class="btn ghost" data-usun="' + k + '"' + (v.length > 1 ? '' : ' disabled') + '>Usuń ostatni</button></div>' + (k === 'gildie' ? '<p class="small">Usunięcie gildii kasuje jej postęp. Nowa gildia zaczyna od zera. Zmiana działa po naciśnięciu „Zapisz zmiany”.</p>' : '');
    } else {
      h += '<table>' + Object.keys(v).map(function(x){
        var val = v[x], pole;
        if (typeof val === 'boolean') pole = '<select data-c="' + k + '" data-k="' + esc(x) + '" data-b="1" aria-label="' + esc(x) + '"><option value="1"' + (val ? ' selected' : '') + '>tak</option><option value="0"' + (val ? '' : ' selected') + '>nie</option></select>';
        else pole = '<input ' + (typeof val === 'number' ? 'type="number" step="any"' : 'type="text"') + ' data-c="' + k + '" data-k="' + esc(x) + '" value="' + esc(val) + '" aria-label="' + esc(x) + '">';
        return '<tr><td>' + esc(x) + '</td><td>' + pole + '</td></tr>'; }).join('') + '</table>';
    }
    h += '</details>';
  });
  return h + '</div><div class="btns"><button class="btn amber" id="zapiszCfg">Zapisz zmiany</button></div><p class="small">„pilnuj_godzin” na „nie” wyłącza sprawdzanie godzin, co przydaje się do prób. Przed grą ustawcie „tak”.</p>';
}
function zbierzCennik(){
  var c = JSON.parse(JSON.stringify(S.cfgEdycja || S.w.konfiguracja)), pola = $app.querySelectorAll('[data-c]'), zle = '';
  for (var i = 0; i < pola.length; i++){
    var p = pola[i], sek = p.dataset.c, k = p.dataset.k, v = p.value;
    if (sek === 'znajdzki'){ c.znajdzki = v.split('\n').map(function(x){ return x.trim(); }).filter(Boolean); continue; }
    var cel = p.dataset.i !== undefined ? c[sek][Number(p.dataset.i)] : c[sek];
    if (p.dataset.b) cel[k] = v === '1';
    else if (p.type === 'number'){ if (v === '' || isNaN(Number(v))) zle = 'Pole „' + k + '” musi być liczbą.'; cel[k] = Number(v); }
    else cel[k] = v;
    p.setAttribute('data-stale', '1');
  }
  return { c: c, zle: zle };
}
function zapiszCennik(){
  var z = zbierzCennik(); if (z.zle) return toast(z.zle, true);
  S.cfgEdycja = z.c;
  wykonaj({ typ:'zapisz_konfiguracje', konfiguracja: z.c });
}
var CFG_NOWY = {
  gildie: function(n){ return { nazwa: 'Gildia ' + n, haslo: 'gildia' + n + '-zmien' }; },
  punkty_martwe: function(n){ return { nazwa: 'Punkt martwy ' + n, pytanie: '', odpowiedz: '', nagroda: 25 }; },
  punkty_zywe: function(n){ return { nazwa: 'Punkt żywy ' + n }; }
};
function zmienWiersze(sekcja, dodaj){
  var z = zbierzCennik(), l = z.c[sekcja];
  if (dodaj) l.push(CFG_NOWY[sekcja](l.length + 1)); else if (l.length > 1) l.pop();
  S.cfgEdycja = z.c; S.cfgOtwarte = sekcja; rysuj();
}
function kGra(w){
  var q = encodeURIComponent(S.haslo), u = w.konfiguracja.ustawienia;
  return '<h2>Gra</h2><div class="card"><p>Godzina na serwerze: <b>' + esc(w.teraz) + '</b>.</p><p>Pilnowanie godzin: <b>' + (u.pilnuj_godzin ? 'włączone' : 'wyłączone (tryb próbny)') + '</b>. Start ' + esc(u.start_gry) + ', ostatnie 10 minut od ' + esc(u.ostatnie_10_min) + ', koniec ' + esc(u.koniec_gry) + '.</p></div>' +
    '<h2>Eksport</h2><div class="card"><p class="sub">Kopia na wypadek awarii i do podsumowania po grze.</p><div class="btns"><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="/eksport.csv?haslo=' + q + '">Dziennik (CSV do Excela)</a><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="/eksport.json?haslo=' + q + '">Pełny stan (JSON)</a></div></div>' +
    '<h2>Zdjęcia</h2><div class="card"><p class="sub">Zdjęcia od gildii leżą na serwerze w katalogu danych. Po grze warto je usunąć.</p><div class="btns"><button class="btn ghost" id="usunZdj">Usuń wszystkie zdjęcia</button></div></div>' +
    '<h2>Wyzerowanie gry</h2><form class="card" id="fReset"><p class="sub">Usuwa cały postęp wszystkich gildii i dziennik. Cennik i hasła zostają. Poprzedni stan zapisuje się w kopii na serwerze. Wpiszcie słowo RESET.</p><div class="field"><input id="resetTxt" type="text" aria-label="Wpisz RESET" autocomplete="off" autocapitalize="characters"><button class="btn bad">Wyzeruj grę</button></div></form>' + wylogujLink();
}

// ---------- start ----------
var zap = pam('bm_haslo');
if (zap){ S.haslo = zap; api(null).then(function(o){ if (o.blad){ S.haslo = ''; pam('bm_haslo', null); } else S.w = o.widok; rysuj(); }).catch(function(){ S.haslo = ''; rysuj(); toast('Brak połączenia z serwerem.', true); }); }
else rysuj();
setInterval(function(){ if (S.haslo && S.w && !document.hidden && !$war.querySelector('.zgra')) odswiez(true); }, 8000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.haslo && S.w) odswiez(true); });
</script>
