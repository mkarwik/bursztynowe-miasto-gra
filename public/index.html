<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4f5a">
<title>Bursztynowe Miasto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Układ: jedna kolumna na telefon, górny pasek ze skarbcem, dolny pasek zakładek. Jasne tło, bo gra toczy się na dworze. */
:root{
  --ink:#16262d; --sea:#1d4f5a; --sea2:#2d6b78; --mute:#5c6b70; --line:#cfd8d9; --tint:#eef3f3; --paper:#f7f9f9; --card:#ffffff;
  --amber:#b4730c; --amber2:#e9a23b; --amber-tint:#fbf3e2; --ok:#1f7a4a; --ok-tint:#e5f4ec; --bad:#b3382c; --bad-tint:#fbe9e7;
  --display:"Alegreya",Georgia,serif; --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.35; -webkit-text-size-adjust:100% }
button,input,select,textarea{ font:inherit; color:inherit }
h1,h2,h3{ font-family:var(--display); margin:0; color:var(--sea); line-height:1.1 }
h2{ font-size:1.35rem } h3{ font-size:1.1rem }
p{ margin:0 }
.wrap{ max-width:720px; margin:0 auto; padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px }
.top{ position:sticky; top:0; z-index:5; background:var(--sea); color:#fff; padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px }
.top .in{ max-width:720px; margin:0 auto; display:flex; align-items:center; gap:10px; justify-content:space-between }
.top .who{ font-family:var(--display); font-weight:800; font-size:1.15rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.top .nums{ display:flex; gap:14px; flex:none }
.top .num{ text-align:right; line-height:1.05 }
.top .num b{ display:block; font-size:1.25rem; font-variant-numeric:tabular-nums }
.top .num span{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; opacity:.8 }
.top .num.amb b{ color:var(--amber2) }
.banner{ background:var(--amber-tint); border-left:5px solid var(--amber); padding:10px 12px; font-weight:500 }
.banner.bad{ background:var(--bad-tint); border-color:var(--bad) }
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabs .in{ max-width:720px; margin:0 auto; display:flex }
.tabs button{ flex:1; border:0; background:none; padding:12px 2px 10px; font-size:.82rem; font-weight:700; color:var(--mute); border-top:3px solid transparent; cursor:pointer; min-width:0 }
.tabs button[aria-selected="true"]{ color:var(--sea); border-top-color:var(--amber) }
.card{ background:var(--card); border:1px solid var(--line); padding:12px 14px; display:flex; flex-direction:column; gap:8px }
.card.next{ border:2px solid var(--sea) }
.row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap }
.row > *{ min-width:0 }
.name{ font-weight:700; font-size:1.05rem }
.sub{ color:var(--mute); font-size:.92rem }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
.stat{ background:var(--tint); padding:8px 10px; text-align:center }
.stat b{ display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; color:var(--sea) }
.stat span{ font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--mute) }
.stats.five{ grid-template-columns:repeat(5,1fr) } .stats.five .stat b{ font-size:1.25rem }
@media (max-width:420px){ .stats.five{ grid-template-columns:repeat(3,1fr) } }
.btn{ border:0; background:var(--sea); color:#fff; font-weight:700; padding:11px 16px; min-height:46px; cursor:pointer; border-radius:3px }
.btn.amber{ background:var(--amber) } .btn.ghost{ background:#fff; color:var(--sea); border:1.5px solid var(--sea) } .btn.bad{ background:var(--bad) }
.btn:disabled{ background:#c7d0d1; color:#6f7c80; cursor:not-allowed } .btn.ghost:disabled{ background:#fff; border-color:#c7d0d1 }
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:3px solid var(--amber2); outline-offset:2px }
.btns{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.why{ color:var(--bad); font-size:.88rem; font-weight:500 }
.pill{ display:inline-block; padding:2px 9px; font-size:.8rem; font-weight:700; border-radius:20px; background:var(--tint); color:var(--sea) }
.pill.ok{ background:var(--ok-tint); color:var(--ok) } .pill.bad{ background:var(--bad-tint); color:var(--bad) } .pill.amb{ background:var(--amber-tint); color:var(--amber) }
input[type=text],input[type=password],input[type=number],select,textarea{ border:1.5px solid var(--line); background:#fff; padding:10px 12px; min-height:46px; border-radius:3px; width:100% }
.field{ display:flex; gap:8px } .field input{ flex:1; min-width:0 }
table{ border-collapse:collapse; width:100%; font-size:.92rem }
th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top }
th{ font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); background:var(--tint) }
td.n,th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
tr.me td{ background:var(--amber-tint); font-weight:700 } tr.done td{ color:var(--mute) } tr.cur td{ background:var(--tint); font-weight:700 }
.scroll{ overflow-x:auto }
table.cmp{ margin-bottom:6px } table.cmp td:first-child{ white-space:nowrap } table.cmp th,table.cmp td{ padding:7px 5px } table.cmp .n{ text-align:right; width:52px; font-variant-numeric:tabular-nums }
table.porty th,table.porty td{ padding:7px 5px } table.porty td.n,table.porty th.n{ width:46px }
td.nw{ white-space:nowrap }
.log{ display:flex; flex-direction:column }
.log .e{ padding:8px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:54px 1fr; gap:8px }
.log .e .t{ color:var(--mute); font-variant-numeric:tabular-nums } .log .e.no .w{ color:var(--bad) }
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px }
.login .box{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px }
.login h1{ font-size:2.3rem; color:var(--ink) } .eyebrow{ font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:700 }
.modal{ position:fixed; inset:0; z-index:20; background:rgba(22,38,45,.55); display:flex; align-items:center; justify-content:center; padding:16px }
.modal .box{ background:#fff; width:100%; max-width:420px; padding:18px; display:flex; flex-direction:column; gap:14px; border-top:6px solid var(--amber) }
.modal .box.win{ border-top-color:var(--ok) } .modal .box.lose{ border-top-color:var(--bad) }
.dice{ display:flex; gap:10px; justify-content:center }
.die{ width:58px; height:58px; border:2.5px solid var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:2rem; background:#fff }
.die.drop{ opacity:.35; text-decoration:line-through }
.toast{ position:fixed; left:16px; right:16px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:15; max-width:688px; margin:0 auto; padding:12px 14px; background:var(--ok); color:#fff; font-weight:500; box-shadow:0 4px 14px rgba(0,0,0,.25) }
.toast.bad{ background:var(--bad) }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px } @media (max-width:520px){ .grid2{ grid-template-columns:1fr } }
details summary{ cursor:pointer; font-weight:700; color:var(--sea); padding:6px 0 }
.cfg table input{ min-height:38px; padding:6px 8px; min-width:70px } .cfg td{ padding:4px }
.small{ font-size:.88rem; color:var(--mute) }
.edg{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px } @media (max-width:480px){ .edg{ grid-template-columns:1fr } }
.edl{ display:flex; flex-direction:column; gap:3px; font-size:.9rem; color:var(--mute) } .edl input{ color:var(--ink) }
.edc{ display:flex; align-items:center; gap:10px; min-height:44px; font-weight:500 } .edc input{ width:22px; height:22px; flex:none }
@media (prefers-reduced-motion:no-preference){ .modal .box{ animation:pop .16s ease-out } @keyframes pop{ from{ transform:scale(.96); opacity:.6 } to{ transform:none; opacity:1 } } }
</style>
</head>
<body>
<div id="app"></div>
<div id="warstwa"></div>
<script>
'use strict';
var S = { haslo: '', w: null, tab: '', punkt: null, filtr: '', cfgEdycja: null, zajete: false };
var $app = document.getElementById('app'), $war = document.getElementById('warstwa');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pam(k, v){ try{ if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }

function api(akcja){
  return fetch('/api', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ haslo: S.haslo, akcja: akcja || null }) })
    .then(function(r){ return r.json(); });
}
function odswiez(cicho){
  if (!S.haslo) return Promise.resolve();
  return api(null).then(function(o){
    if (o.blad){ if (o.zleHaslo) wyloguj(o.blad); else if (!cicho) toast(o.blad, true); return; }
    S.w = o.widok; if (!cicho || moznaPrzerysowac()) rysuj();
  }).catch(function(){ if (!cicho) toast('Brak połączenia z serwerem. Sprawdźcie internet.', true); });
}
function moznaPrzerysowac(){
  if ($war.innerHTML) return false;
  var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  var pola = $app.querySelectorAll('input[type=text],input[type=number],textarea');
  for (var i = 0; i < pola.length; i++) if (pola[i].value && !pola[i].hasAttribute('data-stale')) return false;
  if (S.w && S.w.rola === 'kadra' && (S.tab === 'cennik' || S.tab === 'korekta')) return false;
  return true;
}
function wykonaj(akcja){
  if (S.zajete) return; S.zajete = true; zamknij();
  api(akcja).then(function(o){
    S.zajete = false;
    if (o.blad){ if (o.zleHaslo) return wyloguj(o.blad); toast(o.blad, true); return; }
    S.w = o.widok; if (akcja && akcja.typ === 'zapisz_konfiguracje' && o.komunikat && o.komunikat.ok){ S.cfgEdycja = null; S.cfgOtwarte = null; }
    rysuj();
    var k = o.komunikat; if (!k) return;
    if (k.atak) wynikAtaku(k); else toast(k.tekst, !k.ok);
  }).catch(function(){ S.zajete = false; toast('Nie udało się wysłać. Sprawdźcie internet i spróbujcie jeszcze raz.', true); });
}
var toastT = null;
function toast(tekst, zle){
  var d = document.getElementById('toast'); if (d) d.remove();
  d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (zle ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = tekst;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(function(){ d.remove(); }, zle ? 7000 : 4500);
  d.onclick = function(){ d.remove(); };
}
function zamknij(){ $war.innerHTML = ''; }
function potwierdz(tytul, opis, etykieta, akcja, klasa){
  $war.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box"><h2>' + esc(tytul) + '</h2>' + (opis ? '<p>' + opis + '</p>' : '') +
    '<div class="btns"><button class="btn ' + (klasa || 'amber') + '" id="mTak">' + esc(etykieta) + '</button><button class="btn ghost" id="mNie">Anuluj</button></div></div></div>';
  document.getElementById('mTak').onclick = function(){ wykonaj(akcja); };
  document.getElementById('mNie').onclick = zamknij;
  document.getElementById('mTak').focus();
}
function wynikAtaku(k){
  var kosci = k.kosci || [], min = kosci.length === 3 ? Math.min.apply(null, kosci) : null, odrzucona = false;
  var h = kosci.map(function(v){ var d = (min !== null && v === min && !odrzucona); if (d) odrzucona = true; return '<div class="die' + (d ? ' drop' : '') + '">' + v + '</div>'; }).join('');
  $war.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box ' + (k.wygrana ? 'win' : 'lose') + '"><h2>' + (k.wygrana ? 'Port zdobyty!' : 'Atak nieudany') + '</h2>' +
    '<div class="dice" aria-label="Wynik rzutu">' + h + '</div><p>' + esc(k.tekst) + '</p><div class="btns"><button class="btn" id="mOk">Dalej</button></div></div></div>';
  document.getElementById('mOk').onclick = zamknij; document.getElementById('mOk').focus();
}
function wyloguj(komunikat){ S.haslo = ''; S.w = null; S.tab = ''; pam('bm_haslo', null); rysuj(); if (komunikat) toast(komunikat, true); }

// ---------- rysowanie ----------
function rysuj(){
  if (!S.w) return rysujLogowanie();
  if (S.w.rola === 'gildia') return rysujGildie();
  if (S.w.rola === 'punktowy') return rysujPunktowego();
  return rysujKadre();
}
function rysujLogowanie(){
  $app.innerHTML = '<div class="login"><form class="box" id="fLog"><p class="eyebrow">Gra ekonomiczna</p><h1>Bursztynowe Miasto</h1>' +
    '<p class="sub">Wpiszcie hasło swojej gildii. Punktowi i kadra wpisują swoje hasło.</p>' +
    '<label for="haslo" class="sub">Hasło</label><input id="haslo" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false">' +
    '<button class="btn amber" type="submit">Wejdź</button></form></div>';
  document.getElementById('fLog').onsubmit = function(e){
    e.preventDefault(); var h = document.getElementById('haslo').value.trim(); if (!h) return;
    S.haslo = h;
    api(null).then(function(o){
      if (o.blad){ S.haslo = ''; toast(o.blad, true); return; }
      pam('bm_haslo', h); S.w = o.widok; rysuj();
    }).catch(function(){ S.haslo = ''; toast('Brak połączenia z serwerem.', true); });
  };
}
function pasek(tytul, liczby){
  return '<div class="top"><div class="in"><div class="who">' + esc(tytul) + '</div><div class="nums">' + liczby.map(function(l){ return '<div class="num ' + (l[2] || '') + '"><b>' + esc(l[0]) + '</b><span>' + esc(l[1]) + '</span></div>'; }).join('') + '</div></div></div>';
}
function zakladki(lista){
  return '<nav class="tabs"><div class="in" role="tablist">' + lista.map(function(t){ return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + esc(t[1]) + '</button>'; }).join('') + '</div></nav>';
}
function podepnijZakladki(){
  var b = document.querySelectorAll('[data-tab]');
  for (var i = 0; i < b.length; i++) b[i].onclick = function(){ S.tab = this.getAttribute('data-tab'); if (S.tab !== 'cennik') S.cfgEdycja = null; rysuj(); window.scrollTo(0, 0); };
}
function wylogujLink(){ return '<p class="small" style="text-align:center"><button class="btn ghost" id="wyl" style="min-height:38px;padding:6px 14px">Wyloguj</button></p>'; }
function podepnijWyloguj(){ var b = document.getElementById('wyl'); if (b) b.onclick = function(){ wyloguj(); }; }

// ---------- gildia ----------
function rysujGildie(){
  var w = S.w; if (!S.tab) S.tab = 'flota';
  var h = pasek(w.nazwa, [[w.bursztyn, 'bursztyn', 'amb'], [w.porty + '/' + w.ilePortow, 'porty'], [w.rankingUkryty ? '?' : w.miejsce + '.', 'miejsce']]) + '<div class="wrap">';
  if (w.zamkniete) h += '<div class="banner bad">' + esc(w.zamkniete) + '</div>';
  else if (w.faza === 'ostatnie') h += '<div class="banner">Ostatnie 10 minut. Wolno przeprowadzić już tylko jeden atak. Koniec gry o ' + esc(w.godziny.koniec) + '.</div>';
  if (w.bursztyn < 0) h += '<div class="banner bad">Skarbiec jest na minusie. Nie możecie kupować ani atakować, dopóki nie odrobicie długu na punktach.</div>';
  if (S.tab === 'flota') h += gFlota(w);
  if (S.tab === 'atak') h += gAtak(w);
  if (S.tab === 'punkty') h += gPunkty(w);
  if (S.tab === 'dziennik') h += gDziennik(w);
  if (S.tab === 'ranking') h += gRanking(w);
  h += '</div>' + zakladki([['flota', 'Flota'], ['atak', 'Atak'], ['punkty', 'Punkty'], ['dziennik', 'Dziennik'], ['ranking', 'Ranking']]);
  $app.innerHTML = h; podepnijZakladki(); podepnijWyloguj();
  var i, b = $app.querySelectorAll('[data-kup]');
  for (i = 0; i < b.length; i++) b[i].onclick = function(){ var d = this.dataset; potwierdz('Kupić: ' + d.nazwa + '?', 'Cena: <b>' + esc(d.cena) + '</b> bursztynów. Zakupu nie da się cofnąć.', 'Kupuję', { typ:'kup', co: d.kup }); };
  b = $app.querySelectorAll('[data-sprzedaj]');
  for (i = 0; i < b.length; i++) b[i].onclick = function(){ var d = this.dataset; potwierdz('Sprzedać: ' + d.nazwa + '?', 'Dostaniecie <b>' + esc(d.zwrot) + '</b> bursztynów, czyli połowę ceny.', 'Sprzedaję', { typ:'sprzedaj', co: d.sprzedaj }); };
  b = $app.querySelectorAll('[data-atak]');
  for (i = 0; i < b.length; i++) b[i].onclick = function(){ var d = this.dataset; potwierdz('Atak: ' + d.nazwa + '?', esc(d.opis), 'Atakujemy', { typ:'atak', taktyka: d.atak }); };
  b = $app.querySelectorAll('[data-martwy]');
  for (i = 0; i < b.length; i++) b[i].onsubmit = function(e){ e.preventDefault(); var v = this.querySelector('input').value.trim(); if (!v) return toast('Wpiszcie odpowiedź.', true); this.querySelector('input').setAttribute('data-stale', '1'); wykonaj({ typ:'martwy', punkt: Number(this.dataset.martwy), odpowiedz: v }); };
  var fz = document.getElementById('fZnajdzka');
  if (fz) fz.onsubmit = function(e){ e.preventDefault(); var v = this.querySelector('input').value.trim(); if (!v) return toast('Wpiszcie kod.', true); this.querySelector('input').setAttribute('data-stale', '1'); wykonaj({ typ:'znajdzka', kod: v }); };
}
function gFlota(w){
  var h = '<div class="stats"><div class="stat"><b>' + w.sila + '</b><span>Siła</span></div><div class="stat"><b>' + w.zasieg + '</b><span>Zasięg</span></div><div class="stat"><b>' + w.zwrot + '</b><span>Zwrotność</span></div></div>' +
    '<p class="sub">Statków: <b>' + w.ileStatkow + ' z ' + w.limit + '</b>. Koszt naprawy całej floty: <b>' + w.naprawa + '</b>.</p><h2>Statki</h2>' +
    '<div class="scroll"><table class="cmp"><tr><th>Statek</th><th class="n">Cena</th><th class="n">Siła</th><th class="n">Zasięg</th><th class="n">Zwrot.</th><th class="n">Naprawa</th></tr>' +
    w.statki.map(function(s){ return '<tr' + (s.ile ? ' class="cur"' : '') + '><td>' + esc(s.nazwa) + (s.ile ? ' <span class="small">×' + s.ile + '</span>' : '') + '</td><td class="n">' + s.cena + '</td><td class="n">' + s.sila + '</td><td class="n">' + s.zasieg + '</td><td class="n">' + s.zwrot + '</td><td class="n">' + s.naprawa + '</td></tr>'; }).join('') +
    '</table></div><p class="small">Naprawa to koszt naprawy jednego statku po nieudanym ataku. Statystyki floty to suma wszystkich statków i budowli.</p>';
  w.statki.forEach(function(s){
    h += '<div class="card"><div class="row"><span class="name">' + esc(s.nazwa) + '</span>' + (s.ile ? '<span class="pill amb">macie: ' + s.ile + '</span>' : '') + '</div>' +
      '<p class="sub">Siła ' + s.sila + ' · Zasięg ' + s.zasieg + ' · Zwrotność ' + s.zwrot + ' · naprawa kosztuje ' + s.naprawa + '</p><div class="btns">' +
      '<button class="btn" data-kup="' + esc(s.id) + '" data-nazwa="' + esc(s.nazwa) + '" data-cena="' + s.cena + '"' + (s.powod ? ' disabled' : '') + '>Kup za ' + s.cena + '</button>' +
      (s.ile && !w.zamkniete ? '<button class="btn ghost" data-sprzedaj="' + esc(s.id) + '" data-nazwa="' + esc(s.nazwa) + '" data-zwrot="' + s.zwrotZaSprzedaz + '">Sprzedaj za ' + s.zwrotZaSprzedaz + '</button>' : '') +
      (s.powod ? '<span class="why">' + esc(s.powod) + '</span>' : '') + '</div></div>';
  });
  h += '<h2>Budowle</h2><p class="sub">Każdą budowlę stawia się tylko raz. Działa od chwili zakupu.</p>';
  w.budowle.forEach(function(b){
    h += '<div class="card"><div class="row"><span class="name">' + esc(b.nazwa) + '</span>' + (b.ma ? '<span class="pill ok">postawiona</span>' : '') + '</div><p class="sub">' + esc(b.opis) + '</p>' +
      (b.ma ? '' : '<div class="btns"><button class="btn" data-kup="' + esc(b.id) + '" data-nazwa="' + esc(b.nazwa) + '" data-cena="' + b.cena + '"' + (b.powod ? ' disabled' : '') + '>Postaw za ' + b.cena + '</button>' + (b.powod ? '<span class="why">' + esc(b.powod) + '</span>' : '') + '</div>') + '</div>';
  });

  n.b = v('ed_b'); n.z = v('ed_z'); n.p = v('ed_p'); n.fail = v('ed_fail');
  p = $app.querySelectorAll('[data-eds]'); for (i = 0; i < p.length; i++) n.s[p[i].dataset.eds] = p[i].value;
  p = $app.querySelectorAll('[data-edb]'); for (i = 0; i < p.length; i++) n.bud[p[i].dataset.edb] = p[i].checked;
  p = $app.querySelectorAll('[data-edzy]'); for (i = 0; i < p.length; i++) n.zy[p[i].dataset.edzy] = p[i].value;
  p = $app.querySelectorAll('[data-edmd]'); for (i = 0; i < p.length; i++) n.md[p[i].dataset.edmd] = p[i].checked;
  p = $app.querySelectorAll('[data-edmt]'); for (i = 0; i < p.length; i++) n.mt[p[i].dataset.edmt] = p[i].value;
  p = $app.querySelectorAll('[data-edzn]'); for (i = 0; i < p.length; i++) n.zn[p[i].dataset.edzn] = p[i].checked;
  return n;
}
var CFG_OPISY = { ustawienia:'Ustawienia', gildie:'Gildie i hasła', statki:'Statki', budowle:'Budowle', porty:'Porty (99 oznacza „nie da się”)', punkty_martwe:'Punkty martwe', punkty_zywe:'Punkty żywe', znajdzki:'Kody znajdziek (jeden w wierszu)' };
function kCennik(w){
  if (!S.cfgEdycja) S.cfgEdycja = JSON.parse(JSON.stringify(w.konfiguracja));
  var c = S.cfgEdycja, h = '<h2>Cennik i ustawienia</h2><p class="sub">Zmiany działają od razu po zapisaniu. W trakcie gry zmieniajcie tylko to, co konieczne.</p><div class="cfg">';
  Object.keys(CFG_OPISY).forEach(function(k){
    var v = c[k]; h += '<details' + (k === (S.cfgOtwarte || 'gildie') ? ' open' : '') + '><summary>' + esc(CFG_OPISY[k]) + '</summary>';
    if (k === 'znajdzki') h += '<textarea data-c="znajdzki" rows="10" aria-label="Kody znajdziek">' + esc(v.join('\n')) + '</textarea>';
    else if (Array.isArray(v)){
      var kol = Object.keys(v[0] || {});
      h += '<div class="scroll"><table><tr>' + kol.map(function(x){ return '<th>' + esc(x) + '</th>'; }).join('') + '</tr>' + v.map(function(w2, i){
        return '<tr>' + kol.map(function(x){ var num = typeof w2[x] === 'number'; return '<td><input ' + (num ? 'type="number" step="any"' : 'type="text"') + ' data-c="' + k + '" data-i="' + i + '" data-k="' + esc(x) + '" value="' + esc(w2[x]) + '" aria-label="' + esc(x) + '"' + (x === 'id' ? ' readonly' : '') + '></td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      if (CFG_NOWY[k]) h += '<div class="btns" style="margin:8px 0"><button class="btn ghost" data-dodaj="' + k + '">Dodaj wiersz</button><button class="btn ghost" data-usun="' + k + '"' + (v.length > 1 ? '' : ' disabled') + '>Usuń ostatni</button></div>' + (k === 'gildie' ? '<p class="small">Usunięcie gildii kasuje jej postęp. Nowa gildia zaczyna od zera. Zmiana działa po naciśnięciu „Zapisz zmiany”.</p>' : '');
    } else {
      h += '<table>' + Object.keys(v).map(function(x){
        var val = v[x], pole;
        if (typeof val === 'boolean') pole = '<select data-c="' + k + '" data-k="' + esc(x) + '" data-b="1" aria-label="' + esc(x) + '"><option value="1"' + (val ? ' selected' : '') + '>tak</option><option value="0"' + (val ? '' : ' selected') + '>nie</option></select>';
        else pole = '<input ' + (typeof val === 'number' ? 'type="number" step="any"' : 'type="text"') + ' data-c="' + k + '" data-k="' + esc(x) + '" value="' + esc(val) + '" aria-label="' + esc(x) + '">';
        return '<tr><td>' + esc(x) + '</td><td>' + pole + '</td></tr>'; }).join('') + '</table>';
    }
    h += '</details>';
  });
  return h + '</div><div class="btns"><button class="btn amber" id="zapiszCfg">Zapisz zmiany</button></div><p class="small">„pilnuj_godzin” na „nie” wyłącza sprawdzanie godzin, co przydaje się do prób. Przed grą ustawcie „tak”.</p>';
}
function zbierzCennik(){
  var c = JSON.parse(JSON.stringify(S.cfgEdycja || S.w.konfiguracja)), pola = $app.querySelectorAll('[data-c]'), zle = '';
  for (var i = 0; i < pola.length; i++){
    var p = pola[i], sek = p.dataset.c, k = p.dataset.k, v = p.value;
    if (sek === 'znajdzki'){ c.znajdzki = v.split('\n').map(function(x){ return x.trim(); }).filter(Boolean); continue; }
    var cel = p.dataset.i !== undefined ? c[sek][Number(p.dataset.i)] : c[sek];
    if (p.dataset.b) cel[k] = v === '1';
    else if (p.type === 'number'){ if (v === '' || isNaN(Number(v))) zle = 'Pole „' + k + '” musi być liczbą.'; cel[k] = Number(v); }
    else cel[k] = v;
    p.setAttribute('data-stale', '1');
  }
  return { c: c, zle: zle };
}
function zapiszCennik(){
  var z = zbierzCennik(); if (z.zle) return toast(z.zle, true);
  S.cfgEdycja = z.c;
  wykonaj({ typ:'zapisz_konfiguracje', konfiguracja: z.c });
}
var CFG_NOWY = {
  gildie: function(n){ return { nazwa: 'Gildia ' + n, haslo: 'gildia' + n + '-zmien' }; },
  punkty_martwe: function(n){ return { nazwa: 'Punkt martwy ' + n, pytanie: '', odpowiedz: '', nagroda: 25 }; },
  punkty_zywe: function(n){ return { nazwa: 'Punkt żywy ' + n, godziny: '' }; }
};
function zmienWiersze(sekcja, dodaj){
  var z = zbierzCennik(), l = z.c[sekcja];
  if (dodaj) l.push(CFG_NOWY[sekcja](l.length + 1)); else if (l.length > 1) l.pop();
  S.cfgEdycja = z.c; S.cfgOtwarte = sekcja; rysuj();
}
function kGra(w){
  var q = encodeURIComponent(S.haslo), u = w.konfiguracja.ustawienia;
  return '<h2>Gra</h2><div class="card"><p>Godzina na serwerze: <b>' + esc(w.teraz) + '</b>.</p><p>Pilnowanie godzin: <b>' + (u.pilnuj_godzin ? 'włączone' : 'wyłączone (tryb próbny)') + '</b>. Start ' + esc(u.start_gry) + ', ostatnie 10 minut od ' + esc(u.ostatnie_10_min) + ', koniec ' + esc(u.koniec_gry) + '.</p></div>' +
    '<h2>Eksport</h2><div class="card"><p class="sub">Kopia na wypadek awarii i do podsumowania po grze.</p><div class="btns"><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="/eksport.csv?haslo=' + q + '">Dziennik (CSV do Excela)</a><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="/eksport.json?haslo=' + q + '">Pełny stan (JSON)</a></div></div>' +
    '<h2>Wyzerowanie gry</h2><form class="card" id="fReset"><p class="sub">Usuwa cały postęp wszystkich gildii i dziennik. Cennik i hasła zostają. Poprzedni stan zapisuje się w kopii na serwerze. Wpiszcie słowo RESET.</p><div class="field"><input id="resetTxt" type="text" aria-label="Wpisz RESET" autocomplete="off" autocapitalize="characters"><button class="btn bad">Wyzeruj grę</button></div></form>' + wylogujLink();
}

var zap = pam('bm_haslo');
if (zap){ S.haslo = zap; api(null).then(function(o){ if (o.blad){ S.haslo = ''; pam('bm_haslo', null); } else S.w = o.widok; rysuj(); }).catch(function(){ S.haslo = ''; rysuj(); toast('Brak połączenia z serwerem.', true); }); }
else rysuj();
setInterval(function(){ if (S.haslo && S.w && !document.hidden) odswiez(true); }, 8000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.haslo && S.w) odswiez(true); });
